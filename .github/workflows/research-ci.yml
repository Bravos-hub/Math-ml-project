name: Research Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Test
        run: pytest -q

      - name: Check unresolved merge markers
        run: |
          ! git grep -nE \
            '^(<<<<<<< |=======$|>>>>>>> )'

      - name: Run fast interim smoke test
        run: |
          python scripts/build_final_dataset.py
          python scripts/run_authoritative_analysis.py \
            --quick --models dummy_mean ridge --bootstrap-iterations 200

      - name: Verify smoke evidence cannot be accepted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("reports/tables/multi_crop_seasonal_analysis_manifest.json").read_text())
          assert manifest["final_acceptance_gate_passed"] is False
          assert manifest["analysis_status"] != "final"
          PY
