name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python -m compileall -q src scripts
      - run: PYTHONPATH=src pytest -q
      # The full build needs external raw climate caches. CI always verifies
      # code and contracts; rebuild only when the small aggregated inputs are
      # present in the checkout.
      - run: |
          if test -f data/interim/subregion_daily_rainfall.csv && test -f data/interim/subregion_daily_temperature.csv; then
            PYTHONPATH=src python scripts/build_final_dataset.py
          else
            echo "Aggregated climate inputs unavailable; dataset rebuild deferred."
          fi
