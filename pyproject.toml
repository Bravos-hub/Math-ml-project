[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropyield-uganda"
version = "0.2.0"
description = "Crop-yield prediction for Uganda using AAS survey data, CHIRPS rainfall, and PCA-based agroclimatic factors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BRAVE OLIMI" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["uganda_crop_model*"]
exclude = ["cropyield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
