# Model and validation configuration.
#
# Feature names refer to columns of the observed subregion panel
# (data/processed/observed/{crop}_subregion_panel.csv), which carries
# prefixes: rain_ (CHIRPS monthly), daily_ (CHIRPS daily via ClimateSERV),
# temp_ (NASA POWER), soil_ (SoilGrids).

random_seed: 42

target: yield_over_harvested
sensitivity_target: yield_over_planted

feature_sets:
  rainfall_only:
    - rain_MAM
    - rain_SON
    - rain_annual_rainfall
    - rain_rain_cv
  climate:
    - rain_MAM
    - rain_SON
    - rain_DJF
    - rain_JJA
    - rain_annual_rainfall
    - rain_rain_cv
    - rain_max_monthly
    - rain_min_monthly
    - rain_rainy_months
  climate_thermal:
    - rain_MAM
    - rain_SON
    - rain_DJF
    - rain_JJA
    - rain_annual_rainfall
    - rain_rain_cv
    - rain_max_monthly
    - rain_min_monthly
    - rain_rainy_months
    - temp_season_gdd
    - temp_heat_days
    - temp_extreme_heat_days
    - temp_warm_night_days
    - temp_heatwave_count
  full_agroecological:
    - rain_MAM
    - rain_SON
    - rain_DJF
    - rain_JJA
    - rain_annual_rainfall
    - rain_rain_cv
    - rain_max_monthly
    - rain_min_monthly
    - rain_rainy_months
    - rain_rainfall_zscore
    - rain_MAM_zscore
    - rain_SON_zscore
    - temp_season_gdd
    - temp_heat_days
    - temp_extreme_heat_days
    - temp_warm_night_days
    - temp_heatwave_count
    - daily_longest_dry_spell_days
    - daily_dry_spell_count_7d
    - daily_dry_spell_count_10d
    - daily_rain_days_1mm
    - daily_rain_days_10mm
    - daily_rain_days_20mm
    - daily_mean_wet_day_rainfall
    - daily_maximum_5day_rainfall
    - daily_season_length_days
    - daily_false_onset_flag
    - soil_clay
    - soil_sand
    - soil_silt
    - soil_soc
    - soil_bdod
    - soil_cec
    - soil_phh2o

baselines:
  - mean_predictor
  - historical_mean
  - previous_year_yield

models:
  - OLS
  - Ridge
  - PCR
  - PLS
  - RandomForest
  - XGBoost

# Feature representations (review P1 #18): how the same feature set enters a
# model. "raw" uses the original columns; "pca" uses PC scores of the
# continuous features; "hybrid" uses PC scores plus variables not in PCA
# (e.g. crop, season) without duplicating the original inputs.
representations:
  - raw
  - pca
  - hybrid

pca:
  n_components: 0.95        # cumulative variance retained for PC scores
  # Context variables are held outside PCA and supplied to every
  # representation so the comparison is fair.
  context_features: [crop, season_group]

validation_schemes:
  - random_cv
  - group_by_subregion
  - temporal_2018_2020
  - temporal_2020_2018

cross_validation:
  n_folds_random: 5
  n_folds_grouped: 5

uncertainty:
  conformal_alpha: 0.05
  bootstrap_n: 200

# Experiment-tracking thresholds (review P2 #23): emit a warning when the
# analysis sample or the number of distinct target values is too small for a
# "final" performance claim.
experiment_tracking:
  min_sample_size: 100
  min_unique_targets: 10
